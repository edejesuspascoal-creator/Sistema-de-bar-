<script>
/* ---- licenciamento: não editar/remover — o cálculo de custo depende desta verificação ----
   Cada aparelho gera um ID próprio (guardado localmente). O código de ativação
   só serve para esse ID, por isso o mesmo index.html serve qualquer número de
   clientes sem precisar de mudar nada nem publicar cópias diferentes. */
const _SEG='bar-mz-licenca-2026'; // segredo partilhado com o gerador de códigos — não divulgar
const _hsh=s=>{let h=0;for(let i=0;i<s.length;i++){h=(h<<5)-h+s.charCodeAt(i);h|=0}return Math.abs(h)};
const _uid=()=>{try{let id=localStorage.getItem('bar_uid');if(!id){id=[...crypto.getRandomValues(new Uint8Array(6))].map(b=>b.toString(36).padStart(2,'0')).join('').toUpperCase().slice(0,10);localStorage.setItem('bar_uid',id)}return id}catch(e){return 'TEMP-'+Date.now()}};
const _cod=id=>{const h=_hsh(_SEG+id).toString(36).toUpperCase().padStart(6,'0').slice(0,6);return h.slice(0,3)+'-'+h.slice(3)};
const _ok=()=>{try{return localStorage.getItem('lic_ok')===_uid()}catch(e){return false}};
const _req=()=>{if(!_ok())throw new Error('Licença necessária')};
const LIC={tentar(){const v=document.getElementById('lk_c').value.trim().toUpperCase();if(v===_cod(_uid())){try{localStorage.setItem('lic_ok',_uid())}catch(e){}document.getElementById('lk').style.display='none'}else document.getElementById('lk_m').textContent='Código inválido.'},
 copiar(){navigator.clipboard?.writeText(_uid());const b=event.target;b.textContent='Copiado!';setTimeout(()=>b.textContent='Copiar ID',1200)}};
if(!_ok()){document.getElementById('lk').style.display='flex';document.getElementById('lk_id').textContent=_uid()}
</script>

function gtinInfo(c){c=String(c||'').replace(/\D/g,'');const n=c.length;if(![8,12,13,14].includes(n))return{code:c,tipo:`${n} dígitos (inválido)`,valido:false,pais:'Não identificado'};
 const d=[...c].map(Number),ck=d.pop(),s=d.reverse().reduce((a,x,i)=>a+x*(i%2?1:3),0),p=+({8:c.slice(0,3),12:'0'+c.slice(0,2),13:c.slice(0,3),14:c.slice(1,4)}[n]);
 const e=PX.split(';').find(x=>{const[r]=x.split(':'),[a,b]=r.split('-');return p>=+a&&p<=+(b||a)});
 return{code:c,tipo:{8:'EAN-8',12:'UPC-A',13:'EAN-13',14:'GTIN-14'}[n],valido:(10-s%10)%10===ck,pais:e?e.split(':')[1]:'Não identificado'}}
let meta=null;

 savep:()=>{const d=readForm();delete d.info;if(!d.name.trim())return toast('Escreva o nome do item');if(d.type==='BEB'&&!d.ml)return toast('Indique o volume em ml');

  if(d.bar)S.catalog[d.bar]={name:d.name,ml:d.ml,img:d.img};save();closeM();render();toast('Item salvo')},
 delp:()=>{if(confirm('Remover este item do stock?')){S.products=S.products.filter(p=>p.id!==draft.id);save();closeM();render()}},
 sell:d=>sell(d.id,d.k),
 buy:()=>{_req();let id=$('#c_p').value,qty=num('#c_q'),custo=num('#c_c');if(!id)return toast('Escolha o produto');if(qty<=0)return toast('Indique a quantidade');
  if(id==='new'){const nm=$('#c_nm').value.trim(),t=$('#c_t').value,ml=num('#c_ml');if(!nm)return toast('Escreva o nome do produto');if(t==='BEB'&&!ml)return toast('Indique o volume em ml');
   const p={id:uid(),type:t,name:nm,ml,custo,qtd:0,aberto:0,pG:0,pS:0,shot:50,img:'',bar:'',inc:t==='BEB'};p.sku=`SKU-${t}-${String(++S.seq[t]).padStart(5,'0')}`;S.products.push(p);id=p.id}
  const p=P(id);p.qtd+=qty;if(custo>0)p.custo=custo;S.purchases.push({id:uid(),ts:Date.now(),pid:id,name:p.name,qty,custo:p.custo});save();render();toast(`Compra registada${p.inc?'. Complete a foto e os preços no Stock.':''}`)},
 exp:()=>{const d=$('#d_d').value.trim(),v=num('#d_v');if(!d||v<=0)return toast('Preencha a descrição e o valor');S.expenses.push({id:uid(),ts:Date.now(),d,v});save();render()},
 dele:d=>{S.expenses=S.expenses.filter(e=>e.id!==d.id);save();render()},
 cfg:()=>{md('Definições','Nome do negócio, logótipo e cópia de segurança.',`<label>Nome do negócio<input id="s_n" value="${esc(S.cfg.name)}"></label><div class="g2" style="margin-bottom:22px"><label class="b s" style="margin:0">${I('im',16)}Logótipo<input type="file" id="s_l" accept="image/*" hidden></label><button class="b" data-a="cfgs">Salvar</button></div><h2 style="font-size:15px">Cópia de segurança</h2><p class="mu" style="margin:4px 0 14px">Os dados ficam só neste aparelho. Guarde uma cópia com frequência.</p><div class="g2"><button class="b s" data-a="exp2">Exportar cópia</button><label class="b s" style="margin:0">Importar cópia<input type="file" id="s_i" accept=".json" hidden></label></div>`);
  $('#s_l').onchange=async e=>{S.cfg.logo=await toData(URL.createObjectURL(e.target.files[0]));save();render()};
  $('#s_i').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!j.products)throw 0;if(confirm('Substituir os dados atuais pela cópia?')){S=j;save();closeM();render();toast('Cópia importada')}}catch{toast('Ficheiro inválido')}}},
 close:closeM,theme:()=>{S.cfg.theme=S.cfg.theme==='dark'?'light':'dark';save();render()},
 pick:d=>{const o=SO[d.id],cur=$('#'+d.id).value;$('#sh').innerHTML=`<div class="sb"><div class="sk"></div>${o.map(([v,l])=>`<button class="op" data-a="opt" data-id="${d.id}" data-v="${esc(v)}"><span>${esc(l)}</span><i class="${v==cur?'on':''}"></i></button>`).join('')}</div>`;$('#sh').classList.add('on')},
 opt:d=>{const b=$('#'+d.id);b.value=d.v;b.firstElementChild.textContent=SO[d.id].find(x=>x[0]==d.v)[1];$('#sh').classList.remove('on');b.dispatchEvent(new Event('change'))},
 cfgs:()=>{S.cfg.name=$('#s_n').value.trim()||'O meu Bar';save();closeM();render()},
 exp2:()=>{S.cfg.backup=Date.now();save();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download=`copia-bar-${new Date().toISOString().slice(0,10)}.json`;a.click();render();toast('Cópia exportada')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](b.dataset);else if(e.target.id==='md')closeM();else if(e.target.id==='sh')$('#sh').classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
load().then(d=>{if(d)S={...S,...d,cfg:{...S.cfg,...d.cfg}};render()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
